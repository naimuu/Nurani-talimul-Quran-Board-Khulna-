<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="emeraldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#095738" />
      <stop offset="70%" stop-color="#043221" />
      <stop offset="100%" stop-color="#021c13" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Circular text paths -->
    <path id="topTextPath" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    <path id="bottomTextPath" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="250" cy="250" r="242" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="10" filter="url(#shadow)" />
  
  <!-- Decorative Starburst Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" />

  <!-- Middle Decorative Ribbon Area -->
  <circle cx="250" cy="250" r="150" fill="#032317" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="250" cy="250" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Circular Bangla & Arabic Inscriptions -->
  <text fill="#ffffff" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="3">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      নূরানী তা'লীমুল কুরআন বোর্ড খুলনা
    </textPath>
  </text>

  <text fill="#fbbf24" font-family="'Hind Siliguri', 'Noto Sans Bengali', Arial, sans-serif" font-size="19" font-weight="bold" letter-spacing="4">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      ★ বাংলাদেশ ★ স্থাপিত: ২০০৮ ইং
    </textPath>
  </text>

  <!-- Decorative Side Stars -->
  <g transform="translate(48, 250) scale(0.9)" fill="url(#goldGrad)">
    <polygon points="0,-12 3.7,-3.7 12,0 3.7,3.7 0,12 -3.7,3.7 -12,0 -3.7,-3.7"/>
  </g>
  <g transform="translate(452, 250) scale(0.9)" fill="url(#goldGrad)">
    <polygon points="0,-12 3.7,-3.7 12,0 3.7,3.7 0,12 -3.7,3.7 -12,0 -3.7,-3.7"/>
  </g>

  <!-- Center Core: Dome, Crescent & Open Holy Quran on Rehal -->
  <g id="centerEmblem" transform="translate(0, -5)">
    <!-- Mosque Dome Silhouette -->
    <path d="M 250,140 C 215,185 200,215 200,240 C 200,240 195,242 195,246 C 195,250 200,252 200,252 L 300,252 C 300,252 305,250 305,246 C 305,242 300,240 300,240 C 300,215 285,185 250,140 Z" 
          fill="#06422b" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Crescent and Star on Dome Top -->
    <path d="M 250,122 C 242,122 236,128 236,135 C 236,142 242,148 250,148 C 246,146 244,141 244,135 C 244,129 246,124 250,122 Z" fill="url(#goldLight)" />
    <polygon points="253,130 254.5,133 258,133.5 255.5,136 256,139.5 253,138 250,139.5 250.5,136 248,133.5 251.5,133" fill="url(#goldLight)" />

    <!-- Open Holy Quran (পবিত্র কুরআনুল কারীম) -->
    <!-- Glow behind Quran -->
    <ellipse cx="250" cy="270" rx="65" ry="30" fill="#fbbf24" fill-opacity="0.15" filter="url(#glow)"/>

    <!-- Pages Left & Right -->
    <path d="M 250,285 C 210,255 175,262 165,270 C 160,274 162,295 168,300 C 180,292 215,286 250,310 Z" 
          fill="url(#goldLight)" stroke="#b45309" stroke-width="2.5" />
    <path d="M 250,285 C 290,255 325,262 335,270 C 340,274 338,295 332,300 C 320,292 285,286 250,310 Z" 
          fill="#ffffff" stroke="#b45309" stroke-width="2.5" />

    <!-- Quran Text Lines (Calligraphic hints) -->
    <!-- Left Page -->
    <path d="M 180,278 C 200,273 220,275 240,288" stroke="#043221" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 178,287 C 198,282 218,284 238,297" stroke="#043221" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Right Page -->
    <path d="M 320,278 C 300,273 280,275 260,288" stroke="#043221" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 322,287 C 302,282 282,284 262,297" stroke="#043221" stroke-width="2.5" stroke-linecap="round" />

    <!-- Center Spine of Holy Quran -->
    <path d="M 250,284 L 250,312" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Golden Rehal (Wooden/Gold Book Stand) -->
    <path d="M 205,305 L 295,355 M 295,305 L 205,355" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round" />
    <path d="M 190,355 L 225,355 M 275,355 L 310,355" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Diamond Inlay in Rehal Base -->
    <polygon points="250,323 256,330 250,337 244,330" fill="url(#goldLight)" stroke="#b45309" stroke-width="1.5" />
  </g>
</svg>
